name: Diagnose PR975 Patch

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show exact PR975 patch checksum
        run: |
          echo "=== SHA256 DER GITHUB-DATEI ==="
          sha256sum patches/pr-975.patch
          echo "=== DATEIGROESSE ==="
          wc -c patches/pr-975.patch
          echo "=== DATEITYP ==="
          file patches/pr-975.patch
